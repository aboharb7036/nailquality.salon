<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صالون جودة الأظافر | Nail Quality Salon</title>
    <!-- تضمين خطوط ومكتبات التصميم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #d4a373;
            --secondary-color: #faedcd;
            --dark-color: #2b2b2b;
            --light-color: #f8f9fa;
            --accent-color: #bc6c25;
            --success-color: #2a9d8f;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--light-color);
            color: var(--dark-color);
            line-height: 1.6;
        }
        header {
            background: var(--dark-color);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary-color);
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }
        h2 {
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 0.5rem;
        }
        /* أزرار التصفح والفلاتر للخدمات */
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--secondary-color);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--primary-color);
            color: white;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .service-item {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            background: #fff;
        }
        .service-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover {
            background: var(--accent-color);
        }
        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 2rem;
        }
        .nav-tab {
            padding: 10px 20px;
            background: #ddd;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-tab.active {
            background: var(--dark-color);
            color: var(--primary-color);
        }
        .section-view {
            display: none;
        }
        .section-view.active {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-wand-magic-sparkles"></i> صالون جودة الأظافر (Nail Quality Salon)</h1>
        <div>
            <span id="userStatus">مرحباً بكِ</span>
        </div>
    </header>

    <div class="container">
        <!-- أزرار التنقل بين البوابات -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchView('clientView')">بوابة العميلة والحجوزات</button>
            <button class="nav-tab" onclick="switchView('cashierView')">بوابة الكاشير والإدارة (POS)</button>
        </div>

        <!-- 1. بوابة العميلة -->
        <div id="clientView" class="section-view active">
            <div class="card">
                <h2>حجز موعد جديد وتصفح الخدمات</h2>
                
                <!-- زر التصفح للخدمات (Categories Filter) -->
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterServices('all', 'client')">الكل</button>
                    <button class="filter-btn" onclick="filterServices('nails', 'client')">العناية بالأظافر</button>
                    <button class="filter-btn" onclick="filterServices('gel', 'client')">جل وباديكير</button>
                    <button class="filter-btn" onclick="filterServices('art', 'client')">رسم ونقش</button>
                </div>

                <div class="services-grid" id="clientServicesGrid">
                    <!-- يتم جلب الخدمات ديناميكياً هنا -->
                    <div class="service-item" data-category="nails">
                        <h3>بديكير أساسي</h3>
                        <p>السعر: 100 ر.س</p>
                        <button class="btn" onclick="selectService('بديكير أساسي', 100)">اختيار الخدمة</button>
                    </div>
                    <div class="service-item" data-category="gel">
                        <h3>تركيب جل أظافر</h3>
                        <p>السعر: 200 ر.س</p>
                        <button class="btn" onclick="selectService('تركيب جل أظافر', 200)">اختيار الخدمة</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. بوابة الكاشير والإدارة -->
        <div id="cashierView" class="section-view">
            <div class="card">
                <h2>نقطة البيع (POS) وإدارة الفواتير</h2>
                
                <!-- زر التصفح للخدمات في الكاشير -->
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterServices('all', 'cashier')">الكل</button>
                    <button class="filter-btn" onclick="filterServices('nails', 'cashier')">العناية بالأظافر</button>
                    <button class="filter-btn" onclick="filterServices('gel', 'cashier')">جل وباديكير</button>
                </div>

                <div class="services-grid" id="cashierServicesGrid">
                    <div class="service-item" data-category="nails">
                        <h3>بديكير أساسي</h3>
                        <p>100 ر.س</p>
                        <button class="btn" onclick="addToPOS('بديكير أساسي', 100)">إضافه للفاتورة</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- سكربت التحكم بالواجهات والتصفح -->
    <script>
        function switchView(viewId) {
            document.querySelectorAll('.section-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // دالة تصفح الخدمات عبر الأزرار (Category Filter)
        function filterServices(category, target) {
            const gridId = target === 'client' ? 'clientServicesGrid' : 'cashierServicesGrid';
            const container = document.getElementById(gridId);
            const items = container.getElementsByClassName('service-item');

            // تحديث الأزرار النشطة
            event.target.parentElement.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // تصفية العناصر
            for (let item of items) {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            }
        }

        function selectService(name, price) {
            alert(`تم اختيار الخدمة: ${name} بسعر ${price} ر.س. تابع إتمام الحجز للواتساب.`);
        }

        function addToPOS(name, price) {
            alert(`تمت إضافة ${name} إلى الفاتورة الحالية.`);
        }
    </script>
</body>
</html>
